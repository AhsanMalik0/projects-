[tool.poetry]
name = "voice-agent-platform"
version = "1.0.0"
description = "AI Voice Call Agent Platform — FastAPI + Anthropic Claude + PostgreSQL + Pinecone"
authors = ["AhsanMalik0"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "workers" },
]

[tool.poetry.dependencies]
python = "^3.11"

# API framework
fastapi = "^0.111"
uvicorn = { version = "^0.30", extras = ["standard"] }
python-multipart = "^0.0.9"

# Database
sqlalchemy = { version = "^2.0", extras = ["asyncio"] }
asyncpg = "^0.29"
alembic = "^1.13"
redis = { version = "^5.0", extras = ["hiredis"] }

# AI / LLM
anthropic = "^0.30"
openai = "^1.35"
google-genai = "^1.0"

# STT / TTS
deepgram-sdk = "^3.4"
elevenlabs = "^1.5"

# Vector DB
pinecone-client = "^3.2"
qdrant-client = { version = "^1.9", extras = ["fastembed"] }

# Task queue
celery = { version = "^5.4", extras = ["redis"] }

# Validation / config
pydantic = "^2.7"
pydantic-settings = "^2.3"
python-jose = { version = "^3.3", extras = ["cryptography"] }
passlib = { version = "^1.7", extras = ["bcrypt"] }
cryptography = "^43.0"

# HTTP / async
httpx = "^0.27"
aiofiles = "^23.2"

# Observability
prometheus-fastapi-instrumentator = "^7.0"
sentry-sdk = { version = "^2.5", extras = ["fastapi"] }
structlog = "^24.2"

# Document processing
pymupdf = "^1.24"
python-docx = "^1.1"
tiktoken = "^0.7"

# Text search
rank-bm25 = "^0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
httpx = "^0.27"
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
